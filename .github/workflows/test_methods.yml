name: Run tests for features 7, 8, and 9

on:
  push:
    branches: [ main, "*" ]
  pull_request:
    branches: [ main, "*" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # If you ever add requirements:
          # pip install -r requirements.txt

      - name: Run unittests for features 7, 8, 9
        run: |
          python -m unittest \
            Test_Feature_7.py \
            Test_Feature_8.py \
            Test_Feature_9.py
