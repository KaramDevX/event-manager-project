name: Event Manager Feature Tests

on: [push, pull_request]

jobs:
  event-manager-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Event Manager Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Requirements
      run: |
        python -m pip install --upgrade pip

    # -----------------------
    # Feature 1: Create & List Events (task_01)
    # -----------------------
    - name: Run Event Creation & Listing Tests
      run: |
        python -m unittest discover -v

    # -----------------------
    # Feature 2: Delete Event (task_02)
    # -----------------------
    - name: Run Event Deletion Tests
      run: |
        python -m unittest discover -v

    # -----------------------
    # Feature 3: Register Attendee (task_03)
    # -----------------------
    - name: Run Attendee Registration Tests
      run: |
        python -m unittest discover -v